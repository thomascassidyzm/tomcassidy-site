<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wheel of life</title>
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1f; --muted:#6e6e73; --line:#d8d8d2; --card:#fff; --accent:#2f6fde;
    --c0:#2f62c9; --c1:#2e8540; --c2:#c8372d; --c3:#b85f00; --c4:#c2307a; --c5:#7b4bc4; --c6:#0b7f80; --c7:#7a6a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#ececec; --muted:#9a9aa0; --line:#33363d; --card:#1f2228; --accent:#6ea2ff;
      --c0:#7aa2ff; --c1:#6fcf86; --c2:#ff7b6e; --c3:#ffaa4d; --c4:#ff7eb9; --c5:#b493ff; --c6:#4fd1cf; --c7:#d9c84a; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
    font:16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { padding:12px 12px calc(24px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; overflow-x:hidden; }
  h1 { font-size:22px; margin:4px 4px 8px; font-weight:650; }
  svg { width:100%; height:auto; display:block; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .ring { fill:none; stroke:var(--line); stroke-width:1; }
  .spoke { stroke-width:1.2; stroke-opacity:.5; }
  .hit { fill:transparent; cursor:pointer; }
  .dot { opacity:.3; pointer-events:none; }
  .dot.on { opacity:1; }
  .poly { fill:var(--fg); fill-opacity:.07; stroke:var(--fg); stroke-width:2.5; stroke-linejoin:round; pointer-events:none; }
  .lbl { fill:var(--fg); font-size:12px; font-weight:600; pointer-events:none; }
  .num { font-size:9px; font-weight:700; pointer-events:none; }
  ul { list-style:none; padding:0; margin:8px 0 0; }
  li { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:6px 6px 6px 12px; margin-bottom:6px;
    border-left:5px solid var(--row); background:color-mix(in srgb, var(--row) 9%, var(--card)); }
  .sw { width:10px; height:10px; border-radius:50%; flex:none; }
  .name { flex:1; min-width:0; border:0; background:transparent; color:var(--fg); font:inherit; padding:8px 0; }
  .name:focus { outline:none; border-bottom:1px solid var(--accent); }
  .score { color:var(--row); width:34px; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; font-size:18px; }
  button { font:inherit; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:10px;
    min-width:44px; height:44px; font-size:22px; }
  button:active { background:var(--line); }
  .foot { display:flex; justify-content:space-between; align-items:center; margin:12px 4px 0; color:var(--muted); }
  .foot b { color:var(--fg); }
  #reset { font-size:15px; padding:0 14px; }
  .home { margin:20px 4px 0; text-align:center; font-size:13px; }
  .home a { color:var(--muted); text-decoration:none; }
</style>
</head>
<body>
<h1>Wheel of life</h1>
<svg id="wheel" viewBox="-238 -195 476 390" aria-label="Wheel of life"></svg>
<ul id="list"></ul>
<div class="foot"><span>Average: <b id="avg">–</b></span><button id="reset">Reset scores</button></div>
<p class="home"><a href="https://tomcassidy.co">tomcassidy.co</a></p>

<script>
// ---- Edit here: the eight areas, clockwise from the top ----
const AREAS = ["Business / Career", "Finances", "Health", "Family and friends",
  "Romance", "Personal development", "Fun and recreation", "Contribution to society"];
const KEY = "tomcassidy-wol-v1";
const R0 = 14, R = 130;                       // centre gap and rim radius in SVG units
const N = AREAS.length, MAX = 10;
const TINTS = Array.from({ length: 8 }, (_, i) => `var(--c${i})`);   // each area's colour, light and dark in the CSS

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "null") || {}; } catch (e) { state = {}; }   // bad stored data → an empty wheel
if (typeof state !== "object" || Array.isArray(state)) state = {};
state.names = (Array.isArray(state.names) && state.names.length === N && state.names.every(n => typeof n === "string")) ? state.names : AREAS.slice();
state.scores = (Array.isArray(state.scores) && state.scores.length === N && state.scores.every(Number.isFinite)) ? state.scores : Array(N).fill(0);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const ang = i => (-90 + i * 360 / N) * Math.PI / 180;
const rad = s => R0 + (R - R0) * s / MAX;
const pt = (i, r) => [Math.cos(ang(i)) * r, Math.sin(ang(i)) * r];
const svgEl = (tag, attrs) => { const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

// sector wedge for spoke i between radii a and b (half a sector each side)
function wedge(i, a, b) {
  const h = Math.PI / N, t = ang(i);
  const P = (r, th) => (Math.cos(th) * r).toFixed(1) + " " + (Math.sin(th) * r).toFixed(1);
  return `M${P(a, t - h)} L${P(b, t - h)} A${b} ${b} 0 0 1 ${P(b, t + h)} L${P(a, t + h)} A${a} ${a} 0 0 0 ${P(a, t - h)}Z`;
}

function setScore(i, s) { state.scores[i] = Math.max(0, Math.min(MAX, s)); save(); render(); }

function render() {
  const svg = document.getElementById("wheel"); svg.innerHTML = "";
  for (let i = 0; i < N; i++) svg.appendChild(svgEl("path", { d: wedge(i, R0, R), style: `fill:${TINTS[i]}`, "fill-opacity": .13 }));
  for (let s = 1; s <= MAX; s++) svg.appendChild(svgEl("circle", { class: "ring", r: rad(s), "stroke-width": s % 5 ? 1 : 1.6 }));
  for (let i = 0; i < N; i++) { const [x, y] = pt(i, R); svg.appendChild(svgEl("line", { class: "spoke", style: `stroke:${TINTS[i]}`, x1: 0, y1: 0, x2: x, y2: y })); }
  // polygon
  svg.appendChild(svgEl("polygon", { class: "poly", points: state.scores.map((s, i) => pt(i, rad(s)).join(",")).join(" ") }));
  // dots + hit areas (each score owns a ring band of its sector; 10 also takes the area just outside the rim)
  const step = (R - R0) / MAX;
  for (let i = 0; i < N; i++) for (let s = 1; s <= MAX; s++) {
    const [x, y] = pt(i, rad(s));
    svg.appendChild(svgEl("circle", { class: "dot" + (s <= state.scores[i] ? " on" : ""), style: `fill:${TINTS[i]}`, cx: x, cy: y, r: s === state.scores[i] ? 5 : 2.6 }));
    const a = rad(s) - step / 2, b = s === MAX ? R + 18 : rad(s) + step / 2;
    const hit = svgEl("path", { class: "hit", d: wedge(i, Math.max(a, 4), b) });
    hit.addEventListener("click", () => setScore(i, state.scores[i] === s ? s - 1 : s));
    svg.appendChild(hit);
  }
  // labels, wrapped to two lines
  for (let i = 0; i < N; i++) {
    const [x, y] = pt(i, R + 30), c = Math.cos(ang(i));
    const t = svgEl("text", { class: "lbl", x, y, "text-anchor": Math.abs(c) < .3 ? "middle" : c > 0 ? "start" : "end",
      "dominant-baseline": "middle" });
    const words = state.names[i].split(" "), lines = [];
    for (const w of words) { const l = lines[lines.length - 1];
      if (l && (l + " " + w).length <= 13) lines[lines.length - 1] = l + " " + w; else lines.push(w); }
    lines.forEach((l, k) => { const ts = svgEl("tspan", { x, dy: k ? "1.15em" : (-(lines.length - 1) * 0.575) + "em" }); ts.textContent = l; t.appendChild(ts); });
    svg.appendChild(t);
    const n = svgEl("text", { class: "num", style: `fill:${TINTS[i]}`, x: pt(i, R + 10)[0], y: pt(i, R + 10)[1], "text-anchor": "middle", "dominant-baseline": "middle" });
    n.textContent = state.scores[i] || ""; svg.appendChild(n);
  }
  // list
  const ul = document.getElementById("list"); ul.innerHTML = "";
  state.names.forEach((name, i) => {
    const li = document.createElement("li"); li.style.setProperty("--row", TINTS[i]);
    li.innerHTML = `<span class="sw" style="background:${TINTS[i]}"></span><input class="name" enterkeyhint="done"><button aria-label="minus">−</button><span class="score">${state.scores[i] || "–"}</span><button aria-label="plus">+</button>`;
    const inp = li.querySelector("input"); inp.value = name;
    inp.addEventListener("change", () => { state.names[i] = inp.value.trim() || AREAS[i]; save(); render(); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
    const [minus, plus] = li.querySelectorAll("button");
    minus.addEventListener("click", () => setScore(i, state.scores[i] - 1));
    plus.addEventListener("click", () => setScore(i, state.scores[i] + 1));
    ul.appendChild(li);
  });
  const scored = state.scores.filter(s => s > 0);
  document.getElementById("avg").textContent = scored.length ? (scored.reduce((a, b) => a + b, 0) / scored.length).toFixed(1) : "–";
}

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Clear all scores? Area names are kept.")) { state.scores = Array(N).fill(0); save(); render(); }
});
render();
</script>
</body>
</html>
